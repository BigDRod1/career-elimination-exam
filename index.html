<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="An 11-part interactive exam that scores 125 careers against your personality, interests, strengths, values, work style and dealbreakers, crosses off misfits live, and ends with three focus options and a first-year plan.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20x%3D%222.5%22%20y%3D%223.5%22%20width%3D%2219%22%20height%3D%2217%22%20rx%3D%222%22%20fill%3D%22%23fff%22%20stroke%3D%22%23152033%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M6%209h12M6%2015h8%22%20stroke%3D%22%2356627A%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M5%2012.6%2019%2011.4%22%20stroke%3D%22%23C9372B%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Career Elimination Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a test-booklet column on the left, a live elimination ledger on the right; the career board is a dense ledger where names get struck through in red pencil. */
:root{
  --paper:#ECF0EF; --sheet:#FAFBFB; --sheet-2:#E1E7E6; --ink:#152033; --ink-2:#56627A; --rule:#CCD5D7;
  --accent:#2443D6; --accent-ink:#FFFFFF; --accent-soft:#DCE3FB;
  --strike:#C9372B; --strike-2:#E8988F; --on-strike:#FFFFFF; --strike-soft:#F6DFDB;
  --keep:#177A4F; --keep-soft:#D3ECDF; --on-keep:#FFFFFF;
  --mark-bg:#F3D046; --mark-ink:#1C1704; --scrim:rgba(12,16,28,.48);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E131E; --sheet:#161D2B; --sheet-2:#202939; --ink:#E6EAF2; --ink-2:#9AA5BB; --rule:#2B3548;
    --accent:#8299FF; --accent-ink:#0E131E; --accent-soft:#1F2A52;
    --strike:#FF7366; --strike-2:#9C4A42; --on-strike:#1A0D0B; --strike-soft:#3A2020;
    --keep:#4CC38A; --keep-soft:#163327; --on-keep:#0B1A13;
    --mark-bg:#E3C04A; --mark-ink:#1A1505; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E131E; --sheet:#161D2B; --sheet-2:#202939; --ink:#E6EAF2; --ink-2:#9AA5BB; --rule:#2B3548;
  --accent:#8299FF; --accent-ink:#0E131E; --accent-soft:#1F2A52;
  --strike:#FF7366; --strike-2:#9C4A42; --on-strike:#1A0D0B; --strike-soft:#3A2020;
  --keep:#4CC38A; --keep-soft:#163327; --on-keep:#0B1A13;
  --mark-bg:#E3C04A; --mark-ink:#1A1505; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-2)}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-stretch:118%;font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.02em;white-space:nowrap}
.brand-mark{width:24px;height:24px;flex:none}
.brand-mark .box{fill:none;stroke:var(--ink);stroke-width:2}
.brand-mark .ln{stroke:var(--ink-2);stroke-width:1.6;stroke-linecap:round}
.brand-mark .x{stroke:var(--strike);stroke-width:2.4;stroke-linecap:round}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 12px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:14px;white-space:nowrap}
.tab:hover{background:var(--sheet-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
.pill{margin-left:auto;font-family:var(--f-mono);font-size:13px;padding:6px 12px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill b{font-weight:600;color:var(--keep)}
.pill.pulse{animation:pulse .6s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--strike-2)}100%{box-shadow:0 0 0 8px transparent}}
@media (max-width:720px){.tabs{order:3;flex-basis:100%}.brand span{font-size:13px}}

.main{padding-block:24px 72px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
.view-title{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:clamp(28px,4.2vw,40px);line-height:1.05;margin:4px 0 6px;letter-spacing:-.01em}
.view-sub{margin:0;color:var(--ink-2);max-width:64ch}

/* exam layout */
.exam-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:980px){.exam-grid{grid-template-columns:minmax(0,1fr) 320px}}
.exam-main{min-width:0}
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:18px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);cursor:pointer;white-space:nowrap;font-size:13px;color:var(--ink-2);flex:none}
.step:hover{border-color:var(--ink-2)}
.step .sn{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font-family:var(--f-mono);font-size:11.5px;background:var(--sheet-2);color:var(--ink)}
.step.part .sn{background:linear-gradient(to top,var(--keep-soft) var(--p,0%),var(--sheet-2) var(--p,0%))}
.step.done .sn{background:var(--keep);color:var(--on-keep)}
.step[aria-current="step"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.step[aria-current="step"] .sn{outline:2px solid var(--ink);outline-offset:1px}
.part-head{margin-bottom:16px}
.part-title{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:clamp(28px,4.2vw,40px);line-height:1.05;margin:6px 0 10px;letter-spacing:-.01em}
.part-intro{max-width:64ch;color:var(--ink-2);margin:0}
.part-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:8px clamp(16px,3vw,28px)}
.sheet.pad{padding:22px clamp(16px,3vw,28px)}
.subhead{font-family:var(--f-display);font-stretch:108%;font-weight:700;font-size:17px;margin:18px 0 2px}

/* questions */
.q{display:grid;grid-template-columns:2.1em minmax(0,1fr);gap:0 10px;padding:16px 0;border-top:1px solid var(--rule)}
.q:first-child{border-top:0}
.q-num{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);padding-top:3px}
.q.answered>.q-num{color:var(--keep)}
.q-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;align-items:center;min-width:0}
.q.wide .q-body{grid-template-columns:minmax(0,1fr)}
.q-text{font-weight:500}
.q-hint{display:block;font-weight:400;font-size:13px;color:var(--ink-2);margin-top:2px}
@media (max-width:760px){.q-body{grid-template-columns:minmax(0,1fr)}}
.bubs{display:flex;flex-direction:column;gap:5px;width:max-content;max-width:100%}
.bub-row{display:flex;gap:8px}
.bub{position:relative;display:block;cursor:pointer}
.bub input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.bub span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink-2);font-family:var(--f-mono);font-size:12px;color:var(--ink-2);transition:background .12s,border-color .12s,color .12s}
.bub:hover span{border-color:var(--ink);color:var(--ink)}
.bub input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.bub input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.bub-ends{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--ink-2);line-height:1.2}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:block}
.opt input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:block;padding:8px 13px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);font-size:14px;line-height:1.3;cursor:pointer;transition:background .12s,border-color .12s,color .12s}
.opt:hover span{border-color:var(--ink-2)}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.flag input:checked+span{background:var(--strike);border-color:var(--strike);color:var(--on-strike)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.multi-meta{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.linkbtn[aria-pressed="true"]{color:var(--ink);font-weight:600;text-decoration:none}
.part-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}
.part-foot .grp{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;font-size:14px;line-height:1.2;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;border-color:var(--strike);color:var(--strike)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn[data-armed]{background:var(--strike);border-color:var(--strike);color:var(--on-strike)}

/* rail */
.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:980px){.rail{position:sticky;top:calc(var(--hdr,60px) + 16px);align-self:start;max-height:calc(100vh - var(--hdr,60px) - 32px);overflow:auto;scrollbar-width:thin}}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-family:var(--f-display);font-stretch:108%;font-weight:700;font-size:16px;margin:0 0 10px}
.big{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:54px;line-height:1;font-variant-numeric:tabular-nums;margin-top:6px}
.big small{font-size:18px;color:var(--ink-2);font-weight:600;font-stretch:100%}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sheet-2);margin:14px 0 10px}
.stack i{display:block;height:100%;transition:width .4s ease}
.c-in{background:var(--keep)}.c-hard{background:var(--strike)}.c-soft{background:var(--strike-2)}.c-you{background:var(--ink-2)}
.legend{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:5px 8px;align-items:center;font-size:13px}
.legend i{width:10px;height:10px;border-radius:2px;display:block}
.legend b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.leaders{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.leaders li{display:grid;grid-template-columns:1.4em minmax(0,1fr) 2.2em;gap:2px 8px;align-items:center;font-size:13.5px}
.leaders .rk{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.leaders .ft{font-family:var(--f-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.leaders .bar{grid-column:2/4;height:4px;background:var(--sheet-2);border-radius:2px;overflow:hidden}
.leaders .bar i{display:block;height:100%;background:var(--accent)}
.plain{background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.plain:hover{text-decoration:underline;text-underline-offset:2px}
.recent{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.recent .why{display:block;font-size:12px;color:var(--strike);line-height:1.35}
.cov{display:flex;flex-wrap:wrap;gap:6px}
.cov span{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2)}
.cov span.on{border-color:var(--keep);color:var(--keep);background:var(--keep-soft)}

/* strike */
.struck{color:var(--ink-2);background-image:linear-gradient(var(--strike),var(--strike));background-repeat:no-repeat;background-size:100% 2px;background-position:0 60%;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.struck.anim{animation:strike .55s ease-out both}
@keyframes strike{from{background-size:0 2px}to{background-size:100% 2px}}

/* intro */
.intro{display:flex;flex-direction:column;gap:18px}
.intro-title{font-family:var(--f-display);font-stretch:120%;font-weight:800;font-size:clamp(34px,6vw,62px);line-height:.98;letter-spacing:-.015em;margin:4px 0 0}
.intro-title em{font-style:normal;color:var(--accent)}
.intro-lede{font-size:17px;max-width:62ch;margin:0}
.meta-row{display:flex;flex-wrap:wrap;gap:8px}
.meta-row span{font-family:var(--f-mono);font-size:12.5px;padding:5px 10px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet)}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.ledger{font-size:13.5px;line-height:2;margin:0}
.ledger .sep{color:var(--ink-2);opacity:.5;margin:0 7px}
.fine{font-size:12.5px;color:var(--ink-2);max-width:70ch;margin:0}
.parts-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px 18px;margin:0;padding:0;list-style:none;font-size:14px}
.parts-list li{display:flex;gap:10px;align-items:baseline}
.parts-list .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.banner{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:8px;background:var(--mark-bg);color:var(--mark-ink);font-size:14px;margin-bottom:16px}
.banner .btn{background:transparent;color:var(--mark-ink);border-color:var(--mark-ink);padding:5px 12px;font-size:13px}

/* gut + duel */
.gut-row{display:grid;grid-template-columns:2.1em minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.gut-row:first-of-type{border-top:0}
.gut-name{display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0}
.gut-name .nm{font-weight:600;font-size:15px}
.gut-name:hover .nm{text-decoration:underline;text-underline-offset:2px}
.gut-sub{font-size:12.5px;color:var(--ink-2)}
@media (max-width:560px){.gut-row{grid-template-columns:2.1em minmax(0,1fr)}.gut-row .seg{grid-column:2}}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet);flex:none}
.seg button{border:0;border-left:1px solid var(--rule);background:none;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button.gs-k[aria-pressed="true"]{background:var(--keep);color:var(--on-keep)}
.seg button.gs-x[aria-pressed="true"]{background:var(--strike);color:var(--on-strike)}
.duel-q{font-family:var(--f-display);font-stretch:108%;font-weight:700;font-size:20px;margin:6px 0 14px}
.duel-pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch}
.duel-vs{align-self:center;font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
@media (max-width:640px){.duel-pair{grid-template-columns:minmax(0,1fr)}.duel-vs{justify-self:center}}
.duel-card{display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px;border:1.5px solid var(--rule);border-radius:var(--r);background:var(--paper);cursor:pointer;min-width:0;transition:border-color .12s,transform .12s}
.duel-card:hover{border-color:var(--ink);transform:translateY(-2px)}
.duel-card .nm{font-family:var(--f-display);font-stretch:110%;font-weight:800;font-size:22px;line-height:1.1}
.duel-card .ds{font-size:14px;color:var(--ink-2)}
.duel-card .fx{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.bracket{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px;margin-top:20px}
.bracket h4{margin:0 0 6px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.match{font-size:13px;padding:6px 0;border-top:1px solid var(--rule)}
.match .w{font-weight:600}
.match .l{color:var(--ink-2)}
.champ{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:var(--r);background:var(--mark-bg);color:var(--mark-ink)}
.champ .nm{font-family:var(--f-display);font-stretch:115%;font-weight:800;font-size:30px;line-height:1.05}

/* board */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.search{flex:1 1 220px;min-width:0;padding:9px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink)}
.search:focus{border-color:var(--accent);outline:none}
.clusters{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:16px;align-items:start}
.cl-block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 8px 8px;min-width:0}
.cl-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 6px 8px;border-bottom:1px solid var(--rule);margin-bottom:4px}
.cl-name{font-family:var(--f-display);font-stretch:108%;font-weight:700;font-size:15px}
.cl-count{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.tile{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 6px;cursor:pointer}
.tile:hover{background:var(--sheet-2)}
.tile .nm{font-size:14px;font-weight:500;min-width:0}

function bracket(d) {
  const s = d.seeds, n = s.length;
  const first = n === 8 ? [[0,7],[3,4],[1,6],[2,5]] : [[0,3],[1,2]];
  const M = first.map(([i, j]) => ({a: s[i], b: s[j], round: 0}));
  let start = 0, count = first.length, round = 1;
  while (count > 1) {
    for (let k = 0; k < count; k += 2) M.push({a: d.picks[start + k] ?? null, b: d.picks[start + k + 1] ?? null, round});

}
function duelBonus() {

}

function compute() {
  const U = userModel(), res = {};
  for (const c of CAREERS) res[c.id] = scoreCareer(c, U);
  const nComp = Object.keys(res[CAREERS[0].id].comp).length;
  const fitOf = c => res[c.id].fit ?? -1;
  const byFit = (a, b) => fitOf(b) - fitOf(a) || a.n.localeCompare(b.n);
  const hardOut = c => res[c.id].hard.length > 0 && !state.over[c.id];
  const pool = CAREERS.filter(c => !hardOut(c)).sort(byFit);
  const soft = new Set();
  const leaderFit = pool.length && res[pool[0].id].fit != null ? res[pool[0].id].fit : null;
  if (nComp >= 4 && leaderFit != null) {
    pool.forEach((c, i) => { const r = res[c.id]; if (state.over[c.id] || state.stars[c.id] || state.marks[c.id] === 'k') return; if (r.fit < leaderFit - 25 || i >= 30) soft.add(c.id); });
    const kept = pool.filter(c => !soft.has(c.id));
    if (kept.length < 12) for (const c of pool) { if (kept.length >= 12) break; if (soft.has(c.id)) { soft.delete(c.id); kept.push(c); } }
  }
  const D = duelBonus();
  for (const c of CAREERS) {
    const r = res[c.id];
    if (state.marks[c.id] === 'x') { r.status = 'x'; r.stage = 'you'; r.short = 'You crossed it off'; r.reasons = ['You crossed it off yourself.']; }
    else if (hardOut(c)) { r.status = 'x'; r.stage = 'hard'; r.short = r.hard[0].r; r.reasons = r.hard.map(x => x.r); }
    else if (soft.has(c.id)) {

      r.reasons = [`Weak overall fit: ${Math.round(r.fit)} against ${Math.round(leaderFit)} for your top career.` + (w ? ` Weakest area: ${w[0].toLowerCase()} (${Math.round(w[1] * 100)}/100).` : '')];
    } else { r.status = 'in'; r.stage = null; r.short = ''; r.reasons = []; }

  const ranked = standing.slice().sort((a, b) => ((res[b.id].final ?? -1) - (res[a.id].final ?? -1)) || a.n.localeCompare(b.n));
  ranked.forEach((c, i) => { res[c.id].rank = i + 1; });
  const cnt = st => CAREERS.filter(c => res[c.id].stage === st).length;
  const funnel = { total: TOTAL, hard: cnt('hard'), soft: cnt('soft'), you: cnt('you'), standing: standing.length };

}

function explain(c, U, r) {
  const why = [], watch = [];
  if (r.comp.interest != null && U.riasec) {
    const ut = topIdx(U.riasec, 3), ct = topIdx(c.h, 2), shared = ct.filter(i => ut.includes(i));
    if (r.comp.interest >= 0.6 && shared.length) why.push(`Matches your ${joinNice(shared.map(i => RIASEC[i].n))} interests`);
    else if (r.comp.interest < 0.42) watch.push(`Light on what you enjoy most (${joinNice(ut.slice(0, 2).map(i => RIASEC[i].n))})`);
  }
  if (U.vals) {
    const imp = VALUE_KEYS.filter(k => (U.vals[k] ?? 0) >= 0.75 || U.must.includes(k));
    const met = imp.filter(k => c.prov[k] >= 0.62).sort((a, b) => c.prov[b] - c.prov[a]).slice(0, 3);
    if (met.length) why.push(`Delivers what you value: ${joinNice(met.map(k => lc(VAL_LABEL[k])))}`);
    for (const m of U.must) if (c.prov[m] < 0.5) watch.push(`Weak on a must-have: ${lc(VAL_LABEL[m])}`);
  }
  if (U.skillsN >= 6) {

    const gaps = c.sk.filter(k => U.skills[k] != null && U.skills[k] <= 0.25);
    if (strong.length) why.push(`Uses your strengths: ${joinNice(strong.map(k => lc(SKILL_LABEL[k])))}`);
    if (gaps.length) watch.push(`You would need to build: ${joinNice(gaps.map(k => lc(SKILL_LABEL[k])))}`);
  }
  const E = U.env;
  if (E.people != null) {
    const d = E.people - c.pp / 3;
    if (Math.abs(d) <= 0.2) why.push(c.pp >= 2 ? 'Lots of people contact, which you want' : 'Plenty of quiet focus time, which you want');

  if (E.settings && E.settings.length) { const s = c.set.find(x => E.settings.includes(x)); if (s) why.push(`Happens in a setting you like: ${lc(SETTING_LABEL[s])}`); }

  if (E.hours != null && c.hr > Math.min(3, E.hours)) watch.push(`Hours often run ${HOURS[c.hr]} a week`);
  if (E.remote === 'prefer' && c.rm === 0) watch.push('Rarely remote');
  if (U.b5) {
    if (c.st >= 3 && U.b5.S != null && U.b5.S < 0.45) watch.push('High-stress work, and you said pressure gets to you');
    if (c.st >= 3 && U.b5.S != null && U.b5.S >= 0.7) why.push('High-pressure work suits your steady temperament');
    if (c.pp >= 3 && U.b5.E != null && U.b5.E < 0.35) watch.push('Constant people contact may drain you');
  }
  if (U.life.causes && U.life.causes.length) { const cz = c.cz.filter(z => U.life.causes.includes(z)); if (cz.length) why.push(`Connects to causes you care about: ${joinNice(cz.map(z => lc(CAUSE_LABEL[z])))}`); }
  const on = (U.energy.on || []).filter(a => c.acts.includes(a)), off = (U.energy.off || []).filter(a => c.acts.includes(a));
  if (on.length) why.push(`Full of things that energize you: ${joinNice(on.map(a => lc(ACT_LABEL[a])))}`);
  if (off.length) watch.push(`Includes things that drain you: ${joinNice(off.map(a => lc(ACT_LABEL[a])))}`);
  if (U.income && c.p < U.income) watch.push(`Typical pay (about $${c.p}k) is below your $${U.income}k target; top earners reach about $${c.t}k`);
  if (r.extra != null && r.extra > 0.4) watch.push(`About ${fmtYears(r.extra)} more training before you are fully qualified`);

}

function hexChart(vals) {

  const ang = i => (-90 + i * 60) * Math.PI / 180;
  const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
  const poly = r => [0,1,2,3,4,5].map(i => pt(i, r).map(n => n.toFixed(1)).join(',')).join(' ');
  let s = `<svg class="hex" viewBox="0 0 ${W} ${H}" role="img" aria-label="Interest profile across the six Holland types">`;
  [0.25, 0.5, 0.75, 1].forEach(f => { s += `<polygon class="ring" points="${poly(Rr * f)}"/>`; });
  for (let i = 0; i < 6; i++) { const [x, y] = pt(i, Rr); s += `<line class="axis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }
  s += `<polygon class="area" points="${vals.map((v, i) => pt(i, Rr * Math.max(0.04, v)).map(n => n.toFixed(1)).join(',')).join(' ')}"/>`;
  vals.forEach((v, i) => { const [x, y] = pt(i, Rr * Math.max(0.04, v)); s += `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"/>`; });
  RIASEC.forEach((t, i) => {
    const [x, y] = pt(i, Rr + 20), cos = Math.cos(ang(i));

    const dy = i === 0 ? -8 : i === 3 ? 14 : 4;
    s += `<text class="l" x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anchor}">${t.k} <tspan class="v" dx="2">${t.n} ${Math.round(vals[i] * 100)}</tspan></text>`;
  });
  return s + '</svg>';
}

}

  try {
    const res = await SAMPLE_FN(buildPrompt(), opts);
    state.aiText = res.text; save();
    const o = outEl(); if (o) renderMd(o, res.text);
    if (res.truncated && noteEl()) noteEl().textContent = 'The answer was cut short.';
    if (btn.isConnected) btn.textContent = 'Ask again with my latest answers';
  } catch (e) {
    const code = e && e.code, o = outEl(), n = noteEl();
    if (o) { if (e && e.text && code !== 'refused') renderMd(o, e.text); else if (state.aiText) renderMd(o, state.aiText); else o.replaceChildren(); }
    const msg = code === 'cancelled' ? 'Stopped.'
      : ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code) ? 'Claude is not available on this page for your account. Copy your summary into a chat with Claude instead.'
      : code === 'rate_limited' ? 'Too many requests right now. Try again in a few minutes.'
      : code === 'session_expired' ? 'Sign in to Claude again, then try again.'
      : code === 'refused' ? 'Claude declined this request. Try again after changing some answers.'
      : 'Something went wrong reaching Claude. Try again.';
    if (n) n.textContent = msg;
    if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)) { aiUnavailable = true; btn.hidden = true; }
  } finally { btn.disabled = false; stop.hidden = true; }
}
function renderSaveCard() {
  const c = card(null);
  const row = h('div', {class:'cta'});
  row.append(h('button', {class:'btn', type:'button', onclick: () => copyText(summaryLines().join('\n'))}, 'Copy summary'));
  if (DL || HOSTED) {
    row.append(h('button', {class:'btn ghost', type:'button', onclick: () => saveFile('career-exam-results.md', summaryLines().join('\n'))}, 'Save results (.md)'));
    row.append(h('button', {class:'btn ghost', type:'button', onclick: () => saveFile('career-exam-answers.json', JSON.stringify({app:'career-elimination-exam', v:1, a:state.a, marks:state.marks, stars:state.stars, over:state.over, duel:state.duel}, null, 2))}, 'Save answers (.json)'));
  }
  const fileIn = h('input', {type:'file', accept:'.json,application/json', class:'hidden-file', id:'load-file'});
  fileIn.addEventListener('change', () => { const f = fileIn.files && fileIn.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const d = JSON.parse(String(rd.result)); if (!d || typeof d.a !== 'object') throw new Error('bad'); state = Object.assign(fresh(), {a: d.a, marks: d.marks || {}, stars: d.stars || {}, over: d.over || {}, duel: d.duel || null, started: true}); commit({all: true}); toast('Answers loaded.'); } catch (err) { toast('That file is not a saved answers file from this exam.'); } }; rd.readAsText(f); fileIn.value = ''; });
  row.append(h('label', {class:'btn ghost', for:'load-file', style:'cursor:pointer'}, 'Load answers file'), fileIn);
  const reset = h('button', {class:'btn danger', type:'button'}, 'Start over');
  reset.addEventListener('click', () => armButton(reset, 'Click again to erase all answers', () => { resetAll(); toast('All answers erased.'); }));
  row.append(reset);
  c.append(row);
  c.append(h('p', {class:'muted', style:'margin:12px 0 0;font-size:13px'}, capsReady && !DL && !HOSTED ? 'File saving is not available in this view. Copy the summary instead. ' : '', 'Your answers stay in this browser only. Saving an answers file lets you continue on another device.'));
  c.append(h('div', {id:'copy-fallback'}));
  return c;
}
async function saveFile(name, data) {
  if (!DL && HOSTED) {
    const url = URL.createObjectURL(new Blob([data], {type: name.endsWith('.json') ? 'application/json' : 'text/markdown'}));
    const a = h('a', {href: url, download: name, style:'display:none'}); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Download started.'); return;
  }
  if (!DL) return;
  try { const r = await DL.save({filename: name, data}); if (r && r.status === 'saved') toast('Saved.'); }
  catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'rate_limited' ? 'A save is already waiting for your answer.' : 'This view cannot save files. Use Copy summary instead.'); }
}
function copyText(text, done) {
  try {
    navigator.clipboard.writeText(text).then(() => toast(done || 'Summary copied.'), () => copyFallback(text));
  } catch (e) { copyFallback(text); }
}
function copyFallback(text) {
  const box = $('#copy-fallback') || $('#ai-out'); if (!box) return;
  const ta = h('textarea', {class:'copybox', readonly: true, 'aria-label':'Results summary'}); ta.value = text;
  box.replaceChildren(h('p', {style:'margin:12px 0 6px;font-size:13px'}, 'Copying is blocked here. The text is selected below; press Ctrl+C or Cmd+C.'), ta);
  ta.focus(); ta.select();
}

/* ===================== sample + reset ===================== */
function loadSample() {
  const a = {'ctx.stage':'col','ctx.edu':'1','ctx.field':['health','soc'],'ctx.build':'1','ctx.runway':'4','ctx.time':'2','ctx.loc':'2'};
  const b5 = {O:4, C:4, E:3, A:4, S:3}, wig = [0, 1, 0, -1];
  B5.forEach(([id, T, rev], i) => { const v = clamp(b5[T] + wig[i % 4], 1, 5); a['b.' + id] = rev ? 6 - v : v; });
  const ri = {R:2, I:4, A:3, S:5, E:2, C:3}, w2 = [0, 1, -1, 0, 0];
  for (const L of 'RIASEC') for (let i = 1; i <= 5; i++) a[`r.${L}${i}`] = clamp(ri[L] + w2[(i + L.charCodeAt(0)) % 5], 1, 5);
  Object.entries({quant:3, analytic:4, code:2, science:4, writing:3, verbal:4, people:5, lead:3, detail:4, org:4, mech:2, spatial:3, art:3, perform:2, physical:3, lang:2, memory:4}).forEach(([k, v]) => { a['s.' + k] = v; });
  Object.entries({income:3, security:4, impact:5, creativity:3, autonomy:3, prestige:2, variety:3, balance:4, leadership:2, mastery:4, achievement:3, belonging:4, adventure:2}).forEach(([k, v]) => { a['v.' + k] = v; });
  a['v.must'] = ['impact','balance','security'];
  Object.assign(a, {'w.setting':['l','k','o'], 'w.people':4, 'w.structure':3, 'w.pace':3, 'w.physical':3, 'w.remote':'hybrid', 'w.hours':'1', 'w.sched':'eve', 'w.emp':['inst','nonprofit','gov'], 'w.role':'ic', 'w.focus':['p','i']});
  Object.assign(a, {'d.flags':['sales','commission','uniform','danger','long','code'], 'd.edu':'4', 'd.income':'70', 'd.risk':'1', 'd.ai':4});
  Object.assign(a, {'l.success':['difference','family'], 'l.causes':['health','edu','community'], 'l.meaning':4, 'l.visible':2, 'l.ownbiz':2, 'l.family':4, 'l.regret':'help'});
  Object.assign(a, {'e.on':['teach','comfort','research','organize'], 'e.off':['persuade','perform','fix']});
  state = Object.assign(fresh(), {a, sample: true, started: false, board: state.board});
  recent = []; prevStatus = Object.fromEntries(CAREERS.map(c => [c.id, 'in']));
  commit({all: true});
  toast(`Example loaded: ${R.funnel.standing} careers left standing.`);
}
function resetAll() {
  state = Object.assign(fresh(), {board: state.board});
  recent = []; prevStatus = null; aiCtl && aiCtl.abort();
  commit({all: true});
}

/* ===================== routing + commit ===================== */
const VIEWS = ['exam','board','profile','results'];
function currentView() { const v = (location.hash || '').slice(1); return VIEWS.includes(v) ? v : 'exam'; }
function go(v) { if (currentView() === v) route(); else location.hash = v; }
function renderView(v) {
  if (v === 'exam') renderExam(); else if (v === 'board') renderBoard(); else if (v === 'profile') renderProfile(); else renderResults();
}
let lastView = null;
function route() {
  const v = currentView();
  VIEWS.forEach(x => { $('#view-' + x).hidden = x !== v; });
  $$('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.view === v ? 'page' : 'false'));
  renderView(v);
  if (lastView !== v) window.scrollTo(0, 0);
  lastView = v;
}
function commit(opts = {}) {
  save(); compute(); updateHeader();
  const v = currentView();
  if (v === 'exam') { if (opts.exam || opts.all) renderExam(); else { renderRail(); updateExamChrome(); } }
  else renderView(v);
  if (openId && !$('#drawer').hidden) openDetail(openId, true);
}
function setHdr() { const t = $('#top'); if (t) document.documentElement.style.setProperty('--hdr', t.offsetHeight + 'px'); }

function boot(hot) {
  load(hot);
  compute();
  updateHeader();
  $$('.tab').forEach(t => t.addEventListener('click', () => go(t.dataset.view)));
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', setHdr);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
  $('#drawer').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeDetail(); });
  route(); setHdr();
  (async () => {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const [s, d] = await Promise.all([window.claude.use('sample').catch(() => null), window.claude.use('downloads').catch(() => null)]);
        SAMPLE_FN = s; DL = d;
      }
    } catch (e) {}
    capsReady = true;
    if (currentView() === 'results') renderResults();
  })();
}
try {
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else boot(window.claude && window.claude.hot ? window.claude.hot.data : null);
} catch (e) { boot(null); }
})();
</script>
